[project]
name = "tuney"
version = "0.3.55"
description = "🎶 Turn text into music (#noAI) 🎶"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=7.4.3",
    "mido>=1.3.3",
    "numpy>=2.4.1",
    "pydantic>=2.13.3",
    "pynput>=1.8.1",
    "pyside6>=6.11.1",
    "python-rtmidi>=1.5.8",
    "pyttsx3>=2.99",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "tomlkit>=0.15.0",
    "tyro>=1.0.13",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
    "coverage>=7.13.2",
    "expecttest>=0.3.0",
    "impall>=1.7.0",
    "pytest>=9.0.2",
    "pytest-regressions>=2.11.0",
    "pyupgrade>=3.21.2",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel.force-include]
"scala/scales.toml.zip" = "scala/scales.toml.zip"

[tool.hatch.build.targets.sdist.force-include]
"scala/scales.toml.zip" = "scala/scales.toml.zip"

[tool.coverage]
[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = ["pragma: no cover", "if False:", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
root = ["."]
extra-paths = ["type_stubs"]

[project.scripts]
tuney = "tuney.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
