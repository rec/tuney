[project]
name = "tuney"
version = "0.1.0"
description = "🎶 Turn text into music (#noAI) 🎶"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.4.1",
    "pynput>=1.8.1",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "textual>=7.3.0",
    "ty>=0.0.13",
    "typer>=0.20.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tuney = "tuney.__main__:main"
