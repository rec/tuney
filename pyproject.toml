[project]
name = "tuney"
version = "0.2.1"
description = "🎶 Turn text into music (#noAI) 🎶"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "mido>=1.3.3",
    "numpy>=2.4.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pynput>=1.8.1",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "ty>=0.0.13",
    "typer>=0.20.1",
]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]

[dependency-groups]
dev = [
    "coverage>=7.13.2",
    "pytest>=9.0.2",
    "pyupgrade>=3.21.2",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]

[tool.uv]
package = true

[tool.coverage]
[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = ["pragma: no cover", "if False:", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff.format]
quote-style = "single"

[project.scripts]
tuney = "tuney.__main__:main"

[tool.poetry]
name = "tuney"
version = "0.1.0"
description = "🎶 Turn text into music (#noAI) 🎶"
authors = ["Tom Ritchford <tom@swirly.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
