["$defs".Scale]
description = "A generalized musical Scale, where the default is \"regular tuning\".\n\nThe common Western scale has\n* 12 equal-tempered semitones per octave\n* Note names CDEFGAB, with intervals of 2212221 semitones between them\n* FLAT to lower pitch by a semitone, SHARP to raise it\n\nScale generalizes this to allow more or less than 12 notes per octave, N-just limit,\ncustom tunings, different note names and intervals."
title = "Scale"
type = "object"

["$defs".Scale.properties.note_names]
default = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
title = "Note Names"
type = "string"

["$defs".Scale.properties.root]
