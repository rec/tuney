name: Release builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag:
    name: Require tag on main
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tagged commit to be on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: Build ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    env:
      UV_NO_SOURCES: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: Tuney-macOS.zip
            dist-path: dist/Tuney.app
          - name: Windows
            os: windows-latest
            artifact: Tuney-Windows.zip
            dist-path: dist/Tuney
          - name: Linux
            os: ubuntu-22.04
            artifact: Tuney-Linux.tar.gz
            dist-path: dist/Tuney

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install project
        run: uv sync --dev

      - name: Test
        run: uv run pytest

      - name: Build application
        run: uv run --with pyinstaller pyinstaller --windowed --name Tuney tuney/__main__.py

      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - dist/Tuney.app

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "${{ matrix.dist-path }}" "${{ matrix.artifact }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.dist-path }}" -DestinationPath "${{ matrix.artifact }}"

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}" -C dist Tuney

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes
